basePath: /api
definitions:
  models.Pharmacy:
    properties:
      address:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a Pharmacy API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
