stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE_NAME: markzohar3/pharmacy_service
  DOCKER_USERNAME: $DOCKER_USERNAME # Set this in GitLab CI/CD environment variables
  DOCKER_PASSWORD: $DOCKER_PASSWORD # Set this in GitLab CI/CD environment variables

before_script:
  - echo "Starting CI/CD pipeline..."

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA .

test:
  stage: test
  image: alpine:latest
  script:
    - echo "testing ... not implemented yet."

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
