stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE_NAME: markzohar3/pharmacy_service
  DOCKER_USERNAME: $DOCKER_USERNAME 
  DOCKER_PASSWORD: $DOCKER_PASSWORD 

before_script:
  - echo "Starting CI/CD pipeline..."

build:
  stage: build
  image: alpine:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA .

test:
  stage: test
  image: alpine:latest
  script:
    - echo "testing ... not implemented yet."

deploy:
  stage: deploy
  image: alpine:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'      
      when: manual