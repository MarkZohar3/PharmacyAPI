  version: "1.0"
paths:
  /get_pharmacies:
    get:
      consumes:
      - application/json
      description: Retrieves all pharmacies from DB
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Pharmacy'
            type: array
        "400":
          description: Could not get pharmacies
      summary: Retrieve all pharmacies
      tags:
      - pharmacies
